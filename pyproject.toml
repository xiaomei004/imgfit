[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgfit"
version = "0.2.0"
description = "本地离线批量图片压缩：把每张图片精确压进指定大小预算（默认 200KB）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "陈革树", email = "geshuchen709@gmail.com" }]
keywords = ["image", "compress", "jpeg", "resize", "offline", "batch", "图片压缩"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=9.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4.1", "ruff>=0.6"]

[project.scripts]
imgfit = "imgfit.cli:main"

[project.gui-scripts]
imgfit-gui = "imgfit.gui:main"

[project.urls]
Homepage = "https://github.com/xiaomei004/imgfit"
Repository = "https://github.com/xiaomei004/imgfit"
Issues = "https://github.com/xiaomei004/imgfit/issues"
Changelog = "https://github.com/xiaomei004/imgfit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["imgfit"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
