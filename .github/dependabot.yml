# 依赖自动升级：https://docs.github.com/code-security/dependabot/dependabot-options-reference
#
# 策略：
#   * 每月检查一次，避免每周都在你眼前弹 PR
#   * 同一生态的升级全部合并成一个 PR（含大版本），避免一次冒出 6 个 PR；
#     大版本升级会在 PR 描述里标出来，合并前自己看一眼测试结果
#   * 每个 PR 都会自动跑 CI（ci.yml 里配了 pull_request 触发），绿了才算能升
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
    groups:
      actions-deps:
        patterns: ["*"]
