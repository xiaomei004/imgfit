name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 静态检查（语法与未定义名）
        run: python -m ruff check src tests tools

      - name: 单元测试 + 覆盖率
        run: python -m pytest -q --cov=imgfit --cov-report=term-missing --cov-report=xml

      - name: 冒烟测试 CLI
        run: python -m imgfit --version

      - name: 上传覆盖率数据
        # 用 Windows 那一格的覆盖率：Ubuntu runner 没有显示器，GUI 测试会 skip，
        # 统计出来的数字偏低（65% vs 76%），会把徽章带偏
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  badge:
    name: 更新覆盖率徽章
    needs: test
    # PR 上不写徽章（那是别人分支的覆盖率），只有合并进 main 才更新
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 必须 checkout：徽章脚本在仓库里，不 checkout 就只有下载下来的 coverage.xml
      - uses: actions/checkout@v7

      - name: 下载覆盖率数据
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml

      - name: 生成 SVG 徽章
        run: python3 tools/coverage_badge.py --xml coverage.xml --out coverage.svg

      - name: 推送到 badges 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf badges-repo
          if git clone --quiet --depth 1 --branch badges "$URL" badges-repo 2>/dev/null; then
            echo "::notice::badges 分支已存在，增量更新"
          else
            echo "::notice::badges 分支不存在，新建孤儿分支"
            rm -rf badges-repo
            git init --quiet badges-repo
            git -C badges-repo remote add origin "$URL"
            git -C badges-repo checkout --quiet --orphan badges
          fi

          cp coverage.svg badges-repo/coverage.svg
          cd badges-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "徽章内容没变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(badge): 更新覆盖率徽章"
          git push --quiet origin HEAD:badges
