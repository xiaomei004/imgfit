name: Build Windows EXE

# 打 tag 时自动构建单文件 exe，并挂到对应的 Release 上。
# 不在每次 push 时构建：exe 有 29MB，没必要每个提交都产一个。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: 构建 imgfit-gui.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=9.1" pyinstaller

      - name: 打包成单文件 exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name imgfit-gui --paths src --distpath dist --workpath build tools/exe_entry.py

      - name: 冒烟测试（启动 8 秒不崩）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\imgfit-gui.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "exe 启动后立即退出，退出码 $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe 启动正常"

      - name: 上传构建产物（手动触发时也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: imgfit-gui-exe
          path: dist/imgfit-gui.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/imgfit-gui.exe
          fail_on_unmatched_files: true
